/laserscan_map:
  ros__parameters:
    slam_map_topic_name: /map # local map의 PointCloud2
    pose_topic_name: /current_pose # Local Map 상에서의 Pose
    map_angle_range:
    - -180
    - 180
    map_laser_range:
    - 0.0
    - 200.0
    laserscan_angle_increment: 0.1
    map_vertical_fov_range:
    - -30
    - 30
    visualize_frame: ndt_map
  
  



    
    